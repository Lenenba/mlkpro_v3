name: quality

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  laravel-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_ENV: testing
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      EXPECTED_TEST_DATABASE_DRIVER: sqlite
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, gd, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check PHP formatting
        env:
          PINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PINT_DIFF_MODE: ${{ github.event_name == 'push' && 'direct' || 'merge-base' }}
        run: composer qa:format

      - name: Install Node dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Run Node test suite
        run: npm run qa:node

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run static analysis
        run: composer qa:analyse

      - name: Run test suite
        run: composer qa:test

      - name: Build frontend assets
        run: npm run qa:build

      - name: Enforce frontend asset budgets
        env:
          FRONTEND_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run qa:frontend-budgets

  laravel-quality-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: mlkpro_v3_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mlkpro_v3_ci
      DB_USERNAME: root
      DB_PASSWORD: secret
      EXPECTED_TEST_DATABASE_DRIVER: mysql
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, gd, intl, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent; do
            sleep 1
          done

      - name: Run MySQL compatibility suite
        run: |
          php -d memory_limit=512M vendor/bin/pest --stop-on-failure \
            tests/Unit/CompanyFeatureServiceTest.php \
            tests/Unit/MegaMenuServicesTest.php \
            tests/Unit/SocialAutomationExecutionClaimMigrationTest.php \
            tests/Unit/SocialBackfillBatchLedgerMigrationTest.php \
            tests/Unit/SocialDeliveryOutboxMigrationTest.php \
            tests/Unit/SocialDeliveryReconciliationMigrationTest.php \
            tests/Unit/SocialEditorialFoundationMigrationTest.php \
            tests/Unit/SocialLogicalDestinationKeyServiceTest.php \
            tests/Unit/SocialPostRevisionSnapshotServiceTest.php \
            tests/Unit/SocialTransportIdentityMigrationTest.php \
            tests/Unit/SocialTransportCutoverMigrationTest.php \
            tests/Unit/SocialTransportOperationalProofMigrationTest.php \
            tests/Feature/AccountingModulePhaseZeroTest.php \
            tests/Feature/DemoTypeDatabaseCompatibilityTest.php \
            tests/Feature/ExpenseModuleTest.php \
            tests/Feature/ReservationModuleTest.php \
            tests/Feature/ReservationPastOutcomeReconciliationTest.php \
            tests/Feature/ReservationReconciliationInfrastructureTest.php \
            tests/Feature/ReservationRescheduleConcurrencyTest.php \
            tests/Feature/ReservationKioskPublicEndpointsTest.php \
            tests/Feature/PublicBookingLinksTest.php \
            tests/Feature/PlanEntitlementSyncCommandTest.php \
            tests/Feature/PulseBufferLegacyInventoryCommandTest.php \
            tests/Feature/SocialApprovalWorkflowTest.php \
            tests/Feature/SocialAutopilotCommandTest.php \
            tests/Feature/SocialAutopilotWorkspaceTest.php \
            tests/Feature/SocialAutomationRulesSchemaTest.php \
            tests/Feature/SocialDeliveryHealthServiceTest.php \
            tests/Feature/SocialDeliveryOutboxRuntimeTest.php \
            tests/Feature/SocialDeliveryReconcilerTest.php \
            tests/Feature/SocialEditorialFoundationBackfillTest.php \
            tests/Feature/SocialEditorialRevisionInvariantTest.php \
            tests/Feature/SocialLegacyTransportBackfillTest.php \
            tests/Feature/SocialPostsSchemaTest.php \
            tests/Feature/SocialPublishingFeatureTest.php \
            tests/Feature/SocialTransportIdentityInvariantTest.php \
            tests/Feature/SocialTransportCutoverControlPlaneTest.php \
            tests/Feature/SocialTransportReadinessCommandTest.php \
            tests/Feature/SuperAdminModuleAuthorizationTest.php \
            tests/Feature/BillingMutationsApiTest.php

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - laravel-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, gd, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run qa:e2e
